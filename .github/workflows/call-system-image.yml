name: Call System Image (Reusable Workflow)

on:
  workflow_call:
    inputs:
      builder_content_hash:
        description: "Content hash of the builder container image"
        required: true
        type: string
      has_changes:
        description: "Flag indicating if repository changes were detected"
        required: false
        type: boolean
        default: true
    secrets:
      RPM_GPG_KEY:
        description: "GPG key for RPM signing"
        required: false
      RPM_GPG_PASSPHRASE:
        description: "Passphrase for GPG key"
        required: false
      MOK_PRIVATE_KEY:
        description: "Project MOK private key (PEM) that signs the UKI; supplied by the signing environment"
        required: false

jobs:
  lint:
    uses: ./.github/workflows/call-lint.yml

  build-repo:
    name: 📦 Aggregate Repositories & Deploy DNF/Flatpak Channel
    needs: [lint]
    if: ${{ inputs.has_changes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: 📦 Aggregate the tier repositories and publish their images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RPM_GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
          BUILDER_CONTENT_HASH: ${{ inputs.builder_content_hash }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace/forge \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GITHUB_ACTOR="${GITHUB_ACTOR}" \
            -e GITHUB_REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}" \
            -e RPM_GPG_KEY="${RPM_GPG_KEY}" \
            -e RPM_GPG_PASSPHRASE="${RPM_GPG_PASSPHRASE}" \
            "ghcr.io/hr-mes/athanor-builder:${BUILDER_CONTENT_HASH}" \
            bash <<'EOF'
            set -e
            export BUILDAH_ISOLATION=chroot
            export XDG_DATA_HOME=/var/tmp
            export XDG_CONFIG_HOME=/var/tmp
            export XDG_CACHE_HOME=/var/tmp
            export _CONTAINERS_USERNS_CONFIGURED=done

            # Container storage on the workspace mount, i.e. the runner's disk, addressed
            # by path: no bind mount, which the builder could not perform anyway.
            mkdir -p /workspace/var-tmp/containers
            {
              echo '[storage]'
              echo 'driver = "vfs"'
              echo 'runroot = "/workspace/var-tmp/containers/runroot"'
              echo 'graphroot = "/workspace/var-tmp/containers/storage"'
              echo '[storage.options.vfs]'
              echo 'ignore_chown_errors = "true"'
            } > /var/tmp/storage.conf
            export CONTAINERS_STORAGE_CONF=/var/tmp/storage.conf

            if [ -n "${RPM_GPG_KEY}" ]; then
              echo "::add-mask::${RPM_GPG_PASSPHRASE}"
              echo "${RPM_GPG_KEY}" | gpg --import
              mkdir -p ~; echo '%_signature gpg' > ~/.rpmmacros
              echo '%_gpg_name athanor' >> ~/.rpmmacros
              echo '%__gpg_sign_cmd %{__gpg} --batch --verbose --no-armor --passphrase "${RPM_GPG_PASSPHRASE}" --pinentry-mode loopback --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}' >> ~/.rpmmacros
            fi

            echo "${GITHUB_TOKEN}" | buildah login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            bash scripts/fetch_repo_rpms.sh "${GITHUB_REPOSITORY_OWNER}"

            # publish_tier TIER: one of tier0..tier3, or "" for the rolling aggregate. The
            # image is pushed only when the RPM content differs from the published one.
            publish_tier() {
              local tier=$1 dir img_name image new_hash old_hash ctr
              if [ -n "$tier" ]; then
                dir="repo-cache/repo-${tier}"
                img_name="athanor-forge-${tier}-repo:latest"
              else
                dir="repo-cache/repo"
                img_name="athanor-forge-rolling-repo:latest"
              fi
              image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${img_name}"
              new_hash=$(find "$dir" -name '*.rpm' -type f | sort | xargs -r sha256sum | sha256sum | awk '{print $1}')
              old_hash=$(skopeo inspect --config "docker://$image" 2>/dev/null | jq -r '.config.Labels["tier.content.sha256"] // ""')
              if [ -n "$old_hash" ] && [ "$new_hash" = "$old_hash" ]; then
                echo "Tier '${tier:-rolling}' ($img_name): RPM content unchanged, not pushed"
                return 0
              fi
              if [ -n "${RPM_GPG_KEY}" ]; then
                find "$dir" -name '*.rpm' -exec rpmsign --addsign {} +
              fi
              (
                cd "$dir"
                createrepo_c .
                ctr=$(buildah from scratch)
                buildah copy "$ctr" . /
                buildah config --label tier.content.sha256="$new_hash" "$ctr"
                buildah commit --omit-timestamp "$ctr" "$image"
                buildah push "$image"
                buildah rm "$ctr"
                buildah rmi "$image"
              )
            }
            pids=()
            for tier in tier0 tier1 tier2 tier3 ""; do
              publish_tier "$tier" &
              pids+=($!)
            done
            for pid in "${pids[@]}"; do wait "$pid"; done
          EOF

      - name: 🌐 Deploy the DNF channel to GitHub Pages
        # A release step: the channel is published from main only, the way
        # kernel-build.yml moves its :latest tags only from main.
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          EVENT_REPO_NAME: ${{ github.event.repository.name }}
          RPM_GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
          BUILDER_CONTENT_HASH: ${{ inputs.builder_content_hash }}
        run: |
          set -euo pipefail
          podman run -i --rm --security-opt label=disable --security-opt seccomp=unconfined \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace/forge \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GITHUB_ACTOR="${GITHUB_ACTOR}" \
            -e GITHUB_REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e EVENT_REPO_NAME="${EVENT_REPO_NAME}" \
            -e RPM_GPG_KEY="${RPM_GPG_KEY}" \
            -e RPM_GPG_PASSPHRASE="${RPM_GPG_PASSPHRASE}" \
            "ghcr.io/hr-mes/athanor-builder:${BUILDER_CONTENT_HASH}" \
            bash <<'EOF'
            set -e
            if [ -n "${RPM_GPG_KEY}" ]; then
              echo "::add-mask::${RPM_GPG_PASSPHRASE}"
              echo "${RPM_GPG_KEY}" | gpg --import
            fi

            git clone --depth 1 -b gh-pages "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /workspace/pages_repo || {
              mkdir -p /workspace/pages_repo
              cd /workspace/pages_repo
              git init
              git checkout -b gh-pages
            }
            cd /workspace/pages_repo
            git config --global user.name "Athanor Forge"
            git config --global user.email "forge@athanor.os"
            git config --global --add safe.directory /workspace/pages_repo

            rm -rf tier0 tier1 tier2 tier3
            if [ -n "${RPM_GPG_KEY}" ]; then
              gpg --export --armor athanor > RPM-GPG-KEY-athanor
            fi
            cp -a /workspace/forge/repo-cache/repo-tier0 tier0
            cp -a /workspace/forge/repo-cache/repo-tier1 tier1
            cp -a /workspace/forge/repo-cache/repo-tier2 tier2
            cp -a /workspace/forge/repo-cache/repo-tier3 tier3

            mkdir -p recovery
            cp /usr/share/ipxe/ipxe-x86_64.efi recovery/ipxe.efi
            echo '#!ipxe' > recovery/boot.ipxe
            echo 'dhcp' >> recovery/boot.ipxe
            echo "chain https://${GITHUB_REPOSITORY_OWNER}.github.io/${EVENT_REPO_NAME}/recovery/menu.ipxe || shell" >> recovery/boot.ipxe

            # GitHub Pages refuses files above 100 MB; keep the channel well below.
            find . -type f -name '*.rpm' -size +49M -delete

            pids=()
            for tier_dir in tier0 tier1 tier2 tier3; do
              createrepo_c "$tier_dir" &
              pids+=($!)
            done
            for pid in "${pids[@]}"; do wait "$pid"; done

            git add -A
            if git rev-parse HEAD >/dev/null 2>&1; then
              git commit --amend -m "Deploy the DNF and Flatpak channels of Athanor OS"
            else
              git commit -m "Deploy the DNF and Flatpak channels of Athanor OS"
            fi
            git push -f "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          EOF
      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          podman run -i --rm --security-opt label=disable --security-opt seccomp=unconfined -v "${GITHUB_WORKSPACE}:/workspace:rw" -w /workspace docker.io/library/ubuntu:latest rm -rf /workspace/var-tmp || true
          sudo chown -R $(id -u):$(id -g) "${GITHUB_WORKSPACE}" || podman unshare chown -R $(id -u):$(id -g) "${GITHUB_WORKSPACE}" || true

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  dag-system-image:
    name: 💿 System Image & Disk Build
    needs: [build-repo]
    runs-on: ubuntu-24.04
    # The signing environment holds MOK_PRIVATE_KEY, the project MOK that signs the
    # UKI and the external modules (forge/specs/azoth/KERNEL.md).
    environment: signing
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: ⚙️ Prepare environment
        run: |
          set -euo pipefail
          echo "IMAGE_REGISTRY=ghcr.io/hr-mes" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=athanor-system" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=latest" >> ${GITHUB_ENV}
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ❄️ Install Nix (Bedrock Cache & Security Tools)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: 🧹 Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
      - name: 🔑 Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: 🐳 Build OS Image
        # The Containerfile pulls its base and the tier repository images and installs
        # Fedora packages with dnf5, so the build needs the network; the build context
        # is the repository root, where its COPY sources live.
        env:
          RUN_ID: ${{ github.run_id }}
          MOK_PRIVATE_KEY: ${{ secrets.MOK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          [[ -n ${MOK_PRIVATE_KEY:-} ]] || { echo "MOK_PRIVATE_KEY is not available to this job: check the signing environment" >&2; exit 1; }
          # The MOK private key and its certificate reach assemble_uki.sh as build secrets
          # (/run/secrets/uki_key and /run/secrets/uki_cert): they never enter a layer.
          # AZOTH_NVR selects azoth-nvidia:<nvr>-open, the signed NVIDIA modules of the
          # kernel the tier 0 repository carries: both derive from the pins (nvr.sh).
          # docker format: the OCI format has no SHELL instruction and podman would
          # drop the bash -o pipefail the Containerfile sets for every RUN.
          podman build --layers --format docker \
            --build-arg "AZOTH_NVR=$(bash forge/specs/azoth/nvr.sh)" \
            --secret "id=uki_key,env=MOK_PRIVATE_KEY" \
            --secret "id=uki_cert,src=forge/specs/azoth/keys/mok/athanor-mok.pem" \
            -t "${image}:${RUN_ID}" \
            -t "${image}:${DEFAULT_TAG}" \
            -f system/Containerfile .
          podman push "${image}:${RUN_ID}"
          podman push "${image}:${DEFAULT_TAG}"

      - name: 🔐 Sign & Attest OS Image (Zero-Trust Keyless Sigstore)
        # One signature and one SBOM attestation per image digest: the :latest tag
        # resolves to the same digest as :<run_id>, so cosign verify accepts both.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY}/${IMAGE_NAME}:${RUN_ID}"
          nix run nixpkgs#cosign -- login ghcr.io -u "${GITHUB_ACTOR}" -p "${GITHUB_TOKEN}"
          # The SBOM comes from the mounted root filesystem of the local image, not from
          # syft's image source: with about 120 layers and 270k files that source needs
          # more than 20 GiB and took the runner down (sbom_rootfs.sh).
          nix shell nixpkgs#syft -c bash forge/scripts/sbom_rootfs.sh "${image}" system-sbom.spdx.json
          nix shell nixpkgs#cosign -c bash forge/scripts/sign_attest.sh "${image}" system-sbom.spdx.json

      - name: 💿 Build ISO (osbuild)
        # Not osbuild/bootc-image-builder-action: the builder needs our own installer
        # package list mounted over its definitions (build_iso.sh explains why) and the
        # action passes no volumes of its own.
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The builder writes through the root container storage, which the runner's
          # podman does not use by default (bootc-image-builder issue 446).
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf > /dev/null
          bash forge/scripts/build_iso.sh "${IMAGE_REGISTRY}/${IMAGE_NAME}:${RUN_ID}" ./output
          ls -la ./output

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
