name: NVIDIA kmod

# The NVIDIA kernel modules, signed and published (forge/specs/azoth/nvidia.sh,
# docs/architecture/doc_kernel_build.md, section 10). build: nvidia-build.yml, the two
# branches (open 610, legacy 580) against the kernel-devel published for the NVR of the
# pins. sign: on a GitHub runner in the `signing` environment, a job that only sees the
# .ko files and the module signing key. boot: in QEMU, every case of the matrix: the
# signed nvidia.ko of each branch must pass the signature check against the certificate
# compiled into the kernel (ENODEV: no GPU), while an unsigned copy and a copy signed by
# an enrolled Secure Boot-profile MOK must be rejected (EKEYREJECTED). publish: OCI
# azoth-nvidia:<nvr>-<branch> with cosign, SBOM, attestation of the pins and retention.
# Runs only on dispatch: from Kernel Build downstream of the publication (or the reuse)
# of the kernel, or by hand. The gate on PRs is the kmod job of Kernel Build.

on:
  workflow_dispatch:

concurrency:
  group: nvidia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KERNEL_IMAGE: ghcr.io/${{ github.repository_owner }}/azoth
  IMAGE: ghcr.io/${{ github.repository_owner }}/azoth-nvidia

jobs:
  build:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/nvidia-build.yml

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment: signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: nvidia-*-unsigned
          path: out
          merge-multiple: true

      - name: Build the nvidia image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-nvidia forge/specs/azoth/nvidia

      - name: Kernel-devel from the published image
        # Only for scripts/sign-file, which nvidia.sh extracts from the RPM.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nvr=$(bash forge/specs/azoth/nvr.sh)
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          trap 'podman logout ghcr.io' EXIT
          ctr=$(podman create "${KERNEL_IMAGE}-devel:${nvr}" /kernel-devel)
          mkdir -p devel && podman cp "${ctr}:/." devel/ && podman rm "$ctr" > /dev/null

      - name: Sign a copy with an enrolled-MOK-shaped key
        # The negative sample of the boot job: nvidia.ko of the open branch signed by an
        # ephemeral key with the Secure Boot profile, whose certificate boot.sh enrols in
        # MokList. The kernel must refuse it: a Secure Boot key never authorises a module.
        run: |
          set -euo pipefail
          mkdir -p mok
          cp -a out/open mok/open
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -config forge/specs/azoth/keys/profiles/secureboot.cnf -subj '/CN=Athanor OS K3 test MOK/' \
            -keyout "$RUNNER_TEMP/test-mok.key" -out mok/test-mok.pem 2> /dev/null
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/forge" \
            -v "$RUNNER_TEMP/test-mok.key:/run/test-mok.key:ro" \
            -w /forge localhost/azoth-nvidia \
            bash forge/specs/azoth/nvidia.sh sign --key /run/test-mok.key \
              --cert mok/test-mok.pem --devel /forge/devel --out /forge/mok

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-mok-signed
          path: mok/
          if-no-files-found: error

      - name: Sign with the module signing key
        # The key lives in a 0600 file in the runner's tmp for the duration of the
        # command, mounted read-only in the container; the public certificate is in the
        # repository and compiled into the kernel (kernel-local).
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -n ${MODULE_SIGNING_KEY:-} ]] || { echo "MODULE_SIGNING_KEY is not available to this job: check the signing environment" >&2; exit 1; }
          umask 077
          printf '%s\n' "$MODULE_SIGNING_KEY" > "$RUNNER_TEMP/module.key"
          trap 'rm -f "$RUNNER_TEMP/module.key"' EXIT
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/forge" \
            -v "$RUNNER_TEMP/module.key:/run/module.key:ro" \
            -w /forge localhost/azoth-nvidia \
            bash forge/specs/azoth/nvidia.sh sign --key /run/module.key \
              --cert forge/specs/azoth/keys/modules/athanor-modules.pem --devel /forge/devel --out /forge/out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-signed
          path: out/
          if-no-files-found: error

  boot:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-signed
          path: signed

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # The negative check: the same nvidia.ko before signing.
        with:
          name: nvidia-open-unsigned
          path: unsigned

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # The negative check of key separation: nvidia.ko signed by an enrolled MOK.
        with:
          name: nvidia-mok-signed
          path: mok

      - name: Kernel-core from the published image
        run: |
          set -euo pipefail
          nvr=$(bash forge/specs/azoth/nvr.sh)
          ctr=$(podman create "${KERNEL_IMAGE}:${nvr}" /kernel-core)
          mkdir -p out && podman cp "${ctr}:/." out/ && podman rm "$ctr" > /dev/null
          echo "nvr=${nvr}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/kvm

      - name: Build the boot-matrix image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-boot forge/specs/azoth/boot

      - name: Run boot.sh with the signed modules
        # Every case: the trust in the module signing key is compiled into the kernel, so
        # SeaBIOS proves it holds without firmware, and the UEFI cases prove that a MOK
        # enrolled in MokList does not extend it.
        run: |
          set -euo pipefail
          mkdir -p boot-out
          ko="lib/modules/${nvr}.x86_64/extra/nvidia/nvidia.ko"
          podman run --rm --device /dev/kvm -v "$GITHUB_WORKSPACE:/forge" -w /forge localhost/azoth-boot \
            bash forge/specs/azoth/boot.sh --rpms /forge/out --out /forge/boot-out \
              --mok mok/test-mok.pem \
              --insmod "signed/open/${ko}:ENODEV" \
              --insmod "signed/legacy/${ko}:ENODEV" \
              --insmod "unsigned/open/${ko}:EKEYREJECTED" \
              --insmod "mok/open/${ko}:EKEYREJECTED"

      - name: Summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -f boot-out/summary.md ]]; then cat boot-out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('boot-out/**') != '' }}
        with:
          name: nvidia-boot-logs
          path: boot-out/
          if-no-files-found: error

  publish:
    needs: [sign, boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-signed
          path: out

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26

      - name: Publish one OCI image per branch
        id: publish
        env:
          BUILDAH_ISOLATION: chroot
        run: |
          set -euo pipefail
          nvr=$(bash forge/specs/azoth/nvr.sh)
          echo "${GH_TOKEN}" | buildah login -u "${GITHUB_ACTOR}" --password-stdin ghcr.io
          mkdir -p digests
          for driver in open legacy; do
            version=$(cat "out/${driver}/version")
            [[ $(cat "out/${driver}/kver") == "${nvr}.x86_64" ]] || { echo "kver of the ${driver} modules differs from ${nvr}"; exit 1; }
            ctr=$(buildah from scratch)
            buildah copy "$ctr" "out/${driver}/" /
            buildah config \
              --label org.opencontainers.image.title="azoth-nvidia ${driver}" \
              --label org.opencontainers.image.version="${nvr}-${driver}-${version}" \
              --label org.opencontainers.image.revision="${GITHUB_SHA}" \
              --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "$ctr"
            buildah commit --omit-timestamp "$ctr" "${IMAGE}:${nvr}-${driver}"
            buildah push --digestfile "digests/${driver}" "${IMAGE}:${nvr}-${driver}"
            echo "${IMAGE}:${nvr}-${driver} @$(cat "digests/${driver}")"
          done
          echo "nvr=${nvr}" >> "$GITHUB_OUTPUT"

      - name: SBOM, sign, attest
        # cosign keyless; the SBOM comes from the kernel module cataloger of syft; the
        # custom predicate binds the image to the NVIDIA pins and to the kernel.
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | cosign login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          mkdir -p sbom
          for driver in open legacy; do
            ref="${IMAGE}@$(cat "digests/${driver}")"
            python3 - "$driver" > "pins-${driver}.json" <<'PY'
          import json, pathlib, re, sys
          k = pathlib.Path("forge/specs/azoth")
          pins = dict(re.findall(r"^(NVIDIA_\w+)=(.*)$", (k / "pins.env").read_text(), re.M))
          driver = sys.argv[1]
          print(json.dumps({"driver": driver, "version": (pathlib.Path("out") / driver / "version").read_text().strip(),
                            "kernel": (pathlib.Path("out") / driver / "kver").read_text().strip(), "pins": pins}, indent=2))
          PY
            syft scan "registry:${ref}" -o "spdx-json=sbom/${driver}.spdx.json"
            jq -e '[.packages[] | select(.name | startswith("nvidia"))] | length > 0' "sbom/${driver}.spdx.json" > /dev/null \
              || { echo "SBOM of ${driver} lacks the nvidia modules"; exit 1; }
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "sbom/${driver}.spdx.json" "$ref"
            cosign attest --yes --type custom --predicate "pins-${driver}.json" "$ref"
          done
        env:
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Retention (retention.sh)
        run: bash forge/specs/azoth/retention.sh

      - name: Verify (gate K4)
        run: |
          set -euo pipefail
          for driver in open legacy; do
            ref="${IMAGE}@$(cat "digests/${driver}")"
            cosign verify \
              --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null
            cosign verify-attestation --type custom \
              --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null
            echo "verified: $ref"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-attestations
          path: |
            sbom/
            pins-*.json
            digests/
          if-no-files-found: error
