# Force trigger to wake up GitHub Actions
name: Athanor Forge Orchestrator

on:
  push:
    # iso-v0 as well: GitHub registers a workflow on a non-default branch only through a
    # push matching its trigger; without it workflow_dispatch answers 404 on that branch.
    branches: [main, iso-v0]
    paths:
      - "forge/**"
      # The ISO acceptance test lives under forge/ but builds nothing: it installs an
      # already published ISO. Rebuilding the whole DAG when one of its files changes
      # costs an hour and produces the same images.
      - "!forge/test/**"
      # Workspace crates under system/ feed the DAG packages; the Containerfile,
      # scripts and disk configuration under it feed the system image.
      - "system/**"
      - "Cargo.toml"
      # Inputs of the builder image (build-builder hashes both).
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/athanor-forge-orchestrator.yml"
      - ".github/workflows/call-*.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

env:
  REGISTRY: ghcr.io
  FEDORA_VERSION: 43

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/call-lint.yml

  orchestrator-brain:
    name: 🧠 DAG Orchestrator Brain & Distributed Cache
    needs: [lint]
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: forge
    outputs:
      dag_level_0: ${{ steps.brain.outputs.dag_level_0 }}
      dag_level_1: ${{ steps.brain.outputs.dag_level_1 }}
      dag_level_2: ${{ steps.brain.outputs.dag_level_2 }}
      dag_flatpaks: ${{ steps.brain.outputs.dag_flatpaks }}
      dirty_count: ${{ steps.brain.outputs.dirty_count }}
      has_changes: ${{ steps.brain.outputs.has_changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute Dependency DAG & Topological Matrix
        id: brain
        run: ./scripts/dynamic-matrix.sh

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  build-builder:
    needs: [lint]
    uses: ./.github/workflows/call-build-builder.yml

  dag-compile:
    needs: [orchestrator-brain, build-builder]
    uses: ./.github/workflows/call-dag-compile.yml
    with:
      dag_level_0: ${{ needs.orchestrator-brain.outputs.dag_level_0 }}
      dag_level_1: ${{ needs.orchestrator-brain.outputs.dag_level_1 }}
      dag_level_2: ${{ needs.orchestrator-brain.outputs.dag_level_2 }}
      dag_flatpaks: ${{ needs.orchestrator-brain.outputs.dag_flatpaks }}
      builder_hash: ${{ needs.build-builder.outputs.content_hash }}

  system-image:
    needs: [orchestrator-brain, dag-compile, build-builder]
    if: ${{ !cancelled() && needs.orchestrator-brain.outputs.has_changes == 'true' && needs.build-builder.result == 'success' && (needs.dag-compile.result == 'success' || needs.dag-compile.result == 'skipped') }}
    uses: ./.github/workflows/call-system-image.yml
    with:
      builder_content_hash: ${{ needs.build-builder.outputs.content_hash }}
      has_changes: ${{ needs.orchestrator-brain.outputs.has_changes == 'true' }}
    secrets: inherit
