name: Reusable Workflow Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: 🔎 Lint workflows (actionlint + scripts/verify.py)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install actionlint 1.7.9 (checksum-verified, kept off PATH)
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz
          echo "233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: actionlint
        run: /tmp/actionlint -no-color -shellcheck= -pyflakes=
      - name: Structural checks (scripts/verify.py workflows)
        run: python3 scripts/verify.py workflows
      - name: Kernel profile manifest and checker (kernel_profile.py check, unit tests)
        run: |
          set -euo pipefail
          python3 -B forge/specs/athanor-kernel-profile/kernel_profile.py check
          python3 -B -m unittest discover -s forge/specs/athanor-kernel-profile/tests -v
      - name: NVIDIA lock and build gate (unit tests)
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s system/nvidia/tests -v
