# Mount options of the btrfs root file system.
#
# On a composefs root the options cannot come from /etc/fstab: systemd-remount-fs would
# apply a / line to the overlay mounted on /, which refuses it, so the installer removes
# that line. The initrd mounts the physical root with rootflags= from the command line,
# and systemd-fstab-generator joins every rootflags= it finds, so these options add to the
# subvol=root the installer puts there. The installer refuses any root that is not btrfs.
kargs = [
    "rootflags=compress=zstd:1"
]
match-architectures = ["x86_64", "aarch64"]
