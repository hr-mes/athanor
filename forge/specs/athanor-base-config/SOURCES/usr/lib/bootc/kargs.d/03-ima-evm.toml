# Athanor OS IMA Measurement Arguments
#
# Measurement only, deliberately not appraisal. The integrity of the root
# filesystem is guaranteed by composefs, not by IMA.
#
# This file used to carry ima_appraise=enforce, ima_policy=appraise_tcb,
# ima_template=ima-sig and evm=enforce. Appraisal requires every file to carry a
# security.ima signature, and nothing in this project ever produced one: the
# shipped image has 0 signed files out of 2040 binaries in /usr/bin, and the
# repository contains no IMA key, no evmctl and no ostree ima-sign anywhere in
# the build path. The image does ship Fedora's public IMA keys, so the
# verification half was present with nothing to verify.
#
# The result was a system that installed correctly and then dropped to emergency
# mode 16 seconds into first boot:
#
#   audit: type=1800 ... op=appraise_data cause=missing-hash comm="ostree-prepare-"
#   ostree-prepare-root: Failed to mount composefs: Permission denied
#
# What actually protects the rootfs is the chain that is real and enforced:
# Secure Boot, a UKI signed with the project MOK, module.sig_enforce=1,
# lockdown=integrity, and composefs mounting /usr read-only. Upstream ostree is
# explicit that this is the stronger of the two mechanisms: composefs "validates
# an entire filesystem tree, not just individual files", "makes files actually
# read-only, whereas IMA does not by default", and verifies on demand through
# fs-verity instead of reading every file in full on first access.
#
# The next step for integrity is composefs.enabled = signed with an Ed25519 key,
# which lets the initrd check the composefs digest against the signed commit.
# Removing appraisal does not stand in the way of that; it unblocks it.
#
# ima_policy=tcb and ima_hash=sha256 stay: they measure into TPM PCR 10 without
# gating boot, which is what remote attestation (keylime) consumes and the base
# any future signing work would build on.
kargs = [
    "ima_policy=tcb",
    "ima_hash=sha256"
]
match-architectures = ["x86_64", "aarch64"]
