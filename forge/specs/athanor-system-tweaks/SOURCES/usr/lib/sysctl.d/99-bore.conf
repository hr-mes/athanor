# Athanor OS: BORE (Burst-Oriented Response Enhancer) Sysctl Tuning
# Ottimizzazioni per il kernel Chimera con BORE compilato nativamente.

# Abilita lo scheduler BORE
kernel.sched_bore = 1

# Tunable per la reattività del desktop e gaming
kernel.sched_burst_penalty_scale = 1200
kernel.sched_burst_penalty_offset = 15

# Bilanciamento CFS
kernel.sched_cfs_bandwidth_slice_us = 3000
kernel.sched_latency_ns = 2000000
kernel.sched_min_granularity_ns = 300000
kernel.sched_wakeup_granularity_ns = 400000

# Kernel Security Hardening
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_userns_clone = 1
vm.unprivileged_userfaultfd = 0

# --- RISVEGLIO CAPABILITIES DORMIENTI (Chimera Tuning) ---

# 1. FQ & TCP Fast Open. The congestion control is deliberately not set: Azoth builds
#    BBRv3 in and makes it the default (CONFIG_DEFAULT_BBR3), and naming "bbr" here
#    loaded the BBRv1 module and replaced it.
net.core.default_qdisc = fq
net.ipv4.tcp_fastopen = 3

# 2. Ottimizzazione RAM (Swappiness e VFS)
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.watermark_scale_factor = 125

# 3. MGLRU Aggressive Page Reclaim Tuning
# Forza il multigen LRU a essere proattivo
vm.min_free_kbytes = 65536
