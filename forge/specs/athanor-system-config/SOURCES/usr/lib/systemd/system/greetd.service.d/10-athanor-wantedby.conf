# Give greetd a target to be pulled in by.
#
# Fedora's greetd.service declares only `Alias=display-manager.service` under
# [Install] and no WantedBy=. `systemctl preset` therefore creates the alias
# symlink and nothing else: /usr/lib/systemd/system/default.target.wants stays
# empty, and 99-Athanor.preset's `enable greetd.service` line looks applied
# while pulling greetd into no target at all.
#
# The installed system then boots to a text getty on tty1. Acceptance run
# 34262503262 caught it on the framebuffer, which is the one channel the serial
# console cannot truncate:
#
#     Athanor OS 43
#     Kernel 7.1.8-100.azoth.fc43.x86_64 on x86_64 (tty1)
#     athanor login:
#
# greetd declares Conflicts=getty@tty1.service, so the two cannot share tty1:
# the getty won because nothing ever asked for greetd.
#
# graphical.target already carries Wants=display-manager.service, so this could
# in principle come through the alias, but that relies on the alias winning a
# race against getty@tty1 rather than on an ordering anyone declared. Naming the
# target here is what makes greetd start, and makes it obvious why.
[Install]
WantedBy=graphical.target
