d /var/log/greetd 0755 greetd greetd -
d /var/cache/greetd 0755 greetd greetd -
d /var/lib/greetd 0775 greetd greetd -
d /var/lib/greetd/.cache 0775 greetd greetd -
# The greeter PAM stack, replacing greetd's own so pam_systemd is told which seat and
# VT the session owns. Without it the session is registered seatless and libseat cannot
# open a seat for the compositor.
L+ /etc/pam.d/greetd-greeter - - - - /usr/share/athanor-system-config/greetd-greeter.pam
L+ /etc/greetd/config.toml - - - - /usr/share/athanor-system-config/greetd.toml
d /etc/usbguard 0755 root root -
d /var/log/usbguard 0750 root root -
C+ /etc/usbguard/usbguard-daemon.conf - - - - /usr/share/athanor-system-config/usbguard-daemon.conf
f /etc/usbguard/rules.conf 0600 root root - allow with-interface equals { 09:*:* }
