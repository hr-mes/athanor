# The greeter needs the devices it draws and listens on.
#
# Fedora's /usr/lib/sysusers.d/greetd.conf creates the greetd user with no
# supplementary groups at all. greetd then opens its session, logind registers it
# with class "greeter", and the session has no seat:
#
#   systemd-logind: New session 'c4' of user 'greetd' with class 'greeter' and type 'tty'
#   $ loginctl list-sessions
#   SESSION  UID USER     SEAT LEADER CLASS   TTY
#         2 1000 collaudo -    1072   user    ttyS0
#
# libseat's logind backend asks the session for its seat, finds none, and gives up,
# so cage never starts a compositor and greetd reports only that the greeter
# "exited without creating a session" -- acceptance runs up to 34300405944:
#
#   [libseat] No backend was able to open a seat
#   [backend/session/session.c:83] Unable to create seat: Function not implemented
#   [cage.c:318] Unable to create the wlroots backend
#
# greetd takes the VT itself, from `vt = 1` in greetd.toml, rather than being handed
# one by systemd the way getty@.service is with TTYPath and StandardInput=tty. Taking
# a VT needs access to the tty devices, and driving the display needs the DRM nodes,
# so the greeter has to be in both groups. This is what every display manager gets;
# it is the minimum for a session that owns a screen, not a widening of privilege.
m greetd video
m greetd tty
