# Athanor USBGuard baseline.
#
# usbguard.service is enabled by the preset and its implicit policy is block, applied to
# the devices already present at boot as well. Without a rule that admits them, a machine
# with a USB keyboard and mouse boots to a greeter nobody can type into: that is what the
# first install on real hardware did (2026-09-12). Rules match in order, first hit wins.
#
# A device that pairs a HID interface with storage or networking is what a BadUSB looks
# like: refused before the HID rule below could admit it.
reject with-interface all-of { 08:*:* 03:*:* }
reject with-interface all-of { 02:*:* 03:*:* }
reject with-interface all-of { e0:*:* 03:*:* }

# Hubs, then keyboards, mice and their wireless receivers. Everything else present at
# boot stays under the implicit block until a rule or `usbguard allow-device` admits it.
allow with-interface one-of { 09:00:* }
allow with-interface one-of { 03:*:* }
