# The backing directory for the Nix store bind mount. On this ostree system /nix is a
# bind mount of /var/nix (see nix.mount), and /var is the writable, encrypted volume, so
# the store must be created here before the mount runs. Everything below /nix -- the
# store, the db, the profiles, the daemon socket -- is created by the Fedora nix-system
# and nix-daemon packages once the mount is in place, so nothing else is declared here.
d /var/nix 0755 root root -
