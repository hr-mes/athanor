# The Nix store lives on the writable /var, and nix.mount bind-mounts /var/nix onto
# /nix at boot. The Fedora Nix packages create the store skeleton under the read-only
# ostree /nix (only empty directories: store, var, var/nix, var/log/nix/drvs), but the
# bind mount hides that skeleton, so the same skeleton must exist under /var/nix before
# the mount runs -- otherwise nix finds no /nix/store or /nix/var/nix and every command
# fails. tmpfiles is applied at boot before local-fs.target, so these directories are
# ready when nix.mount activates. The store is root:nixbld, mode 1775 (setgid + sticky),
# matching what the Fedora nix-system package sets on the baked /nix/store.
d /var/nix 0755 root root -
d /var/nix/store 1775 root nixbld -
d /var/nix/var 0755 root root -
d /var/nix/var/nix 0755 root root -
d /var/nix/var/log 0755 root root -
d /var/nix/var/log/nix 0755 root root -
d /var/nix/var/log/nix/drvs 0755 root root -
