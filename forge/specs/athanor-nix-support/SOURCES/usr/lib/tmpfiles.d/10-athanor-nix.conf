# The Nix store lives on the writable /var, and nix.mount bind-mounts /var/nix onto
# /nix at boot. The Fedora Nix packages create the store skeleton under the read-only
# ostree /nix, but the bind mount hides that skeleton, so the same skeleton must exist
# under /var/nix before the mount runs -- otherwise nix finds no /nix/store or
# /nix/var/nix and every command fails. tmpfiles runs in systemd-tmpfiles-setup, and
# nix.mount is ordered After=systemd-tmpfiles-setup.service, so these directories are
# ready when the mount activates. The store is root:nixbld, mode 1775 (setgid + sticky),
# matching what the Fedora nix-system package sets on the baked /nix/store.
#
# daemon-socket and builds are not here: /etc/tmpfiles.d/nix-daemon.conf, which replaces
# the Fedora rules that would create them under the read-only ostree /nix, creates them in
# this backing store. Through the bind mount nix-daemon.socket's
# ConditionPathIsReadWrite=/nix/var/nix/daemon-socket is then met and the daemon starts --
# without it a non-root user gets 'Permission denied' on the store lock.
d /var/nix 0755 root root -
d /var/nix/store 1775 root nixbld -
d /var/nix/var 0755 root root -
d /var/nix/var/nix 0755 root root -
d /var/nix/var/log 0755 root root -
d /var/nix/var/log/nix 0755 root root -
d /var/nix/var/log/nix/drvs 0755 root root -
