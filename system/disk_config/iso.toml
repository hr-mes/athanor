[customizations.installer.kickstart]
contents = """
# Athanor boots to its greeter. Anaconda decides the default systemd target by looking for
# a display manager among the packages it installs, and an ostreecontainer install installs
# none -- the content arrives as an image -- so it falls back to what its own code calls
# TEXT_ONLY_TARGET and writes /etc/systemd/system/default.target -> multi-user.target,
# which takes precedence over the graphical.target the image carries in /usr.
#
# The installed system then finished booting one target short: greetd sat enabled, with its
# WantedBy=graphical.target in place, and inactive (dead), because graphical.target was
# never reached. Asked over its own serial console, acceptance run 34275504878 showed both
# links side by side, the /etc one stamped with the install time:
#
#   /etc/systemd/system/default.target -> /usr/lib/systemd/system/multi-user.target
#   /usr/lib/systemd/system/default.target -> graphical.target
#
# xconfig --startxonboot is the kickstart directive that states the intent explicitly, and
# Anaconda honours it ahead of its package-based guess. The %post that used to live here ran
# a second `bootc switch` and made the installed system disagree with itself (101e5781), so
# this file stays limited to what the installer must be told and what only the installer
# can undo: the one %post below removes the / line Anaconda itself writes to /etc/fstab.
# forge/test/iso/collaudo.ks repeats both, because it includes osbuild-base.ks rather than
# this file.
xconfig --startxonboot

%post --erroronfail
set -eu
# Anaconda writes a / line into /etc/fstab (subvol=root,compress=zstd:1,...,ro). On a
# composefs root that line can only fail: systemd-remount-fs.service tries to apply its
# options to the overlay mounted on /, the overlay refuses the reconfiguration, and the
# unit fails on every boot (Fedora Atomic SIG issue 72, rhbz#2348934, bootc issue 971).
# The root is mounted by the initrd from root= and rootflags= on the kernel command line,
# so the line is removed whatever the root file system is.
awk '$1 ~ /^#/ || $2 != "/"' /etc/fstab > /etc/fstab.athanor
mv /etc/fstab.athanor /etc/fstab
# A btrfs root loses compress=zstd:1 with that line, so the option moves to the kernel
# command line of this installation only; any other root file system gets nothing, since
# ext4 and xfs refuse the option and would not mount.
#
# This %post runs chrooted into the new deployment, Anaconda's system root (/mnt/sysroot
# in the installer environment). From the installer environment Anaconda creates the
# sysroot and deploys the image with `ostree admin --sysroot=<physical root>` (init-fs,
# os-init) and `ostree container image deploy --sysroot=<physical root>`, where the
# physical root is /mnt/sysimage. Inside this chroot, PrepareOSTreeMountTargetsTask has
# bind-mounted that physical root at /sysroot, so --sysroot=/sysroot names the same
# sysroot those calls used. (Anaconda's own `ostree admin instutil set-kargs --merge`,
# which writes root= and rootflags=subvol=, is the exception: ConfigureBootloader runs it
# chrooted here without --sysroot and reaches the repository through the deployment's
# ostree -> sysroot/ostree link; pyanaconda/modules/payloads/payload/rpm_ostree/
# installation.py, branch fedora-43.) set-kargs acts on the first deployment, the one
# just installed, and --merge appends the positional argument to its arguments: the
# initrd's systemd-fstab-generator joins every rootflags=. The arguments belong to the
# deployment, so bootc carries them into every later deployment.
root_fstype=$(stat -f -c %T /sysroot)
if [ "$root_fstype" = btrfs ]; then
    ostree admin instutil set-kargs --sysroot=/sysroot --merge rootflags=compress=zstd:1
fi
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription"
]
